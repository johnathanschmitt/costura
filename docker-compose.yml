version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: atelie_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atelie}
      POSTGRES_USER: ${POSTGRES_USER:-atelie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atelie123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-atelie}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atelie_net

  redis:
    image: redis:7-alpine
    container_name: atelie_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD:-redis123}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atelie_net

  minio:
    image: minio/minio:latest
    container_name: atelie_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123456}
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - atelie_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: atelie_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@atelie.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - '5050:80'
    depends_on:
      - postgres
    networks:
      - atelie_net
    profiles:
      - tools

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: atelie_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atelie}:${POSTGRES_PASSWORD:-atelie123}@postgres:5432/${POSTGRES_DB:-atelie}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123456}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - atelie_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atelie_frontend
    networks:
      - atelie_net

  nginx:
    image: nginx:alpine
    container_name: atelie_nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - atelie_net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  atelie_net:
    driver: bridge
